<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow video</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
        }
        /*----------------
        Video Size Buttons
        -----------------*/
        /*Adds space below the group of buttons*/
        .size-controls {
            margin-bottom: 15px;
        }
        /*Style all buttons inside the size-controls section*/
        .size-controls button {
            padding: 8px 14px; /*adds space inside each buttons*/
            margin: 3px; /*adds space between buttons*/
            cursor: pointer; /*changes the mouse pointer to a hand*/
        }

        /*-------------------------
        General Video Player Styles
        -------------------------*/

        /* applies these styles to the video player*/
        video {
            display: block;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16/9;
            height: auto;
            background-color: black;
            transition: width 0.3s ease; /*Makes changes in the video appear smoothly*/
        }

        /*------------------
        Different Video Sizes
        -------------------*/

        /*Small video: 320 px wide*/
        video.small {
            width: 320px;
        }

        /*Medium video: 480 px wide*/
        video.medium {
            width: 480px;
        }

        /*Large video: 720 px wide*/
        video.large {
            width: 720px;
        }

        /*Full video: 100% wide*/
        video.full {
            width: 100%;
        }

    </style>


</head>
<body>
    <!-- -->
    <h1>Snowy Video</h1>
    <p>Watch the Video</p>

    /*-----------------------
    Video Size Control Buttons
    ------------------------*/

    <!--Group the buttons together-->
    <div class="size-controls">
        
    </div>



</body>
</html>
