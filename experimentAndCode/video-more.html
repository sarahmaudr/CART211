<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow video</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
        }
        /*----------------
        Video Size Buttons
        -----------------*/
        /*Adds space below the group of buttons*/
        .size-controls {
            margin-bottom: 15px;
        }
        /*Style all buttons inside the size-controls section*/
        .size-controls button {
            padding: 8px 14px; /*adds space inside each buttons*/
            margin: 3px; /*adds space between buttons*/
            cursor: pointer; /*changes the mouse pointer to a hand*/
        }

        /*-------------------------
        General Video Player Styles
        -------------------------*/

        /* applies these styles to the video player*/
        video {
            display: block;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16/9;
            height: auto;
            background-color: black;
            transition: width 0.3s ease; /*Makes changes in the video appear smoothly*/
        }

        /*------------------
        Different Video Sizes
        -------------------*/

        /*Small video: 320 px wide*/
        video.small {
            width: 320px;
        }

        /*Medium video: 480 px wide*/
        video.medium {
            width: 480px;
        }

        /*Large video: 720 px wide*/
        video.large {
            width: 720px;
        }

        /*Full video: 100% wide*/
        video.full {
            width: 100%;
        }

    </style>


</head>
<body>
    <!-- -->
    <h1>Snowy Video</h1>
    <p>Watch the Video</p>

    <!-----------------------
    Video Size Control Buttons
    -------------------------->

    <!--Group the buttons together-->
    <div class="size-controls">

            <!--Tells visitors what the buttons control-->
        <strong>Video Size:</strong>

            <!--When clicked, calls the JavaScript function and changes the video width to 320px-->
        <button onclick="changeSize('small')">
            Small
        </button>

            <!--When clicked, calls the JavaScript function and changes the video width to 480px-->
        <button onclick="changeSize('medium')">
            Medium
        </button>

            <!--When clicked, calls the JavaScript function and changes the video width to 720px-->
        <button onclick="changeSize('large')">
            Large
        </button>

            <!--When clicked, calls the JavaScript function and changes the video width to available content width-->
        <button onclick="changeSize('full')">
            Full Width 
        </button>

    </div>

    <!-------------
    Video Player
    -------------->

    <!-- id="myVideo" gives the video a unique name tha J5 can use to find it.
    class="full" makes the video start at full width.
    controls displays the built-in play, pause, volume and other controls.-->

    <video id="myVideo" class="full" controls>
        <source src="video_1.mp4" type="video/mp4">
        Sorry, your browser cannot play this video
    </video>

    <!--JavaScript: Change video size-->
    <script>
        //This function runs whenever a size button is clicked.
        // the word 'size' receives the value from the button.
        // such as 'small', 'medium', 'large', or 'full'.

        function changeSize(size) {
            // finds the video element using its unique ID.
            const video = document.getElementById("myVideo");
            
        // removes all four possible size classes
        // this prevents old size settings from remaining active
            video.classList.remove(
                "small",
                "medium",
                "large",
                "full"
            );

            // adds the new size class selected by the visitor.
            // the CSS then applies the matching width
            video.classList.add(size);
        }
    </script>

</body>
</html>
